<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ferramentas de Pedidos</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    :root { color-scheme: light dark; font-family: Segoe UI, Arial, sans-serif; }
    body { margin: 0; padding: 24px; color: #242424; background: #fff; }
    main { max-width: 520px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 14px; }
    p { font-size: 14px; line-height: 1.55; white-space: pre-wrap; margin: 0 0 22px; }
    button { border: 0; border-radius: 4px; padding: 10px 20px; background: #0f6cbd; color: white; font-size: 14px; cursor: pointer; }
    @media (prefers-color-scheme: dark) { body { color: #f5f5f5; background: #292929; } }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Ferramentas de Pedidos</h1>
    <p id="message">Operação finalizada.</p>
    <button id="close">Fechar</button>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById("title").textContent = params.get("title") || "Ferramentas de Pedidos";
    document.getElementById("message").textContent = params.get("message") || "Operação finalizada.";
    document.getElementById("close").addEventListener("click", () => Office.context.ui.closeContainer());
  </script>
</body>
</html>
